{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Create your account</h1>

    <form method="POST">

        <input
            name="name"
            placeholder="Full name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button>
            Create Account
        </button>

    </form>

</div>

{% endblock %}
